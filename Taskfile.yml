version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "build" task'
    deps:
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./...
      - go -C examples get -u tool
      - go mod tidy
      - go -C examples mod tidy

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...
      - go -C examples test ./...

  test-wasm:
    desc: 'Run all Go tests under Node WASM'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
    cmds:
      - 'go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... ./examples/...'

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet ./...
      - go -C examples vet ./...

  build:
    desc: 'Build library and native examples'
    cmds:
      - go build ./...
      - task: build-examples

  clean:
    desc: 'Clean built examples and generated site artifacts'
    deps:
      - clean-wasm-site
    cmds:
      - rm -rf bin .task

###############################################################################
# Examples

  run-gallery:
    desc: 'Run the embedded SVG sample gallery'
    cmds: ['go -C examples run ./gallery']

  run-stage:
    desc: 'Run the immediate-mode vector stage demo'
    cmds: ['go -C examples run ./stage']

  run-charts:
    desc: 'Run the interactive stage.Chart builder demo'
    cmds: ['go -C examples run ./charts']

  run-svgview:
    desc: 'Run the single-pane SVG viewer demo'
    cmds: ['go -C examples run ./svgview']

  build-examples:
    desc: 'Build all native demos'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - for: [gallery, stage, charts, svgview]
        cmd: go -C examples build -o ../bin/ntsvg-{{.ITEM}} ./{{.ITEM}}

  build-ex-svgview:
    desc: 'Build the svgview example'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - go -C examples build -o ../bin/ntsvg-svgview ./svgview

###############################################################################
# Demo website via booba
#
# The default rasterizer (oksvg/rasterx) is pure Go, so all ntsvg demos
# render in the browser with no external JS SVG bridge.

  build-wasm:
    desc: 'Build all browser WASM demos'
    deps: [go-tidy]
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [gallery, stage, charts, svgview]
        cmd: go -C examples build -o ../web/demos/{{.ITEM}}.wasm ./{{.ITEM}}

  build-wasm-site:
    desc: 'Build browser demos and export the pinned booba runtime into web/'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web
      - cp LICENSE.txt web/LICENSE
      - task: check-site

  check-site:
    desc: 'Check JavaScript syntax, site assets, and smoke-test all WASM demos'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - for: [gallery, stage, charts, svgview]
        cmd: node scripts/smoke-demo.mjs {{.ITEM}}

  serve-wasm-site:
    desc: 'Serve demos at http://localhost:8000/web/'
    cmds:
      - task: build-wasm-site
      - python3 -m http.server 8000 --bind 127.0.0.1

  clean-wasm-site:
    desc: 'Remove generated WASM demo site artifacts'
    cmds:
      - rm -rf web/demos web/booba web/ghostty-web
      - rm -f web/wasm_exec.js web/app.wasm web/LICENSE

###############################################################################
# Demo gif (note: Kitty graphics do not render in VHS — this captures
# the half-block path only; do a hand-made recording for Kitty demos).

  vhs-validate:
    desc: 'Validate vhs tape file'
    cmds:
      - vhs validate ./examples/svgview/demo.tape

  vhs:
    desc: 'Generate gif via vhs'
    deps:
      - build-ex-svgview
    cmds:
      - vhs --output ./examples/svgview/demo.gif ./examples/svgview/demo.tape

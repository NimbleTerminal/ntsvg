name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GOWORK: 'off'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            wasm.work.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build library and examples
        run: go build ./...
      - name: Build WASM site
        run: |
          mkdir -p web/demos
          for demo in gallery stage charts svgview; do
            GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js CGO_ENABLED=0 go build -o "web/demos/${demo}.wasm" "./examples/${demo}"
          done
          go tool booba-assets --no-index web
          cp LICENSE.txt web/LICENSE
      - name: Check WASM site and smoke-test demos
        run: |
          node --check web/site.js
          node scripts/check-site.mjs
          for demo in gallery stage charts svgview; do
            node scripts/smoke-demo.mjs "${demo}"
          done
      - name: Test browser picture transport
        run: GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" . -run TestBrowserSharedMemoryLifecycle -v

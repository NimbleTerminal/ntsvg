name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GOWORK: 'off'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            wasm.work.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build examples
        run: go build ./...
      - name: Build WASM
        run: GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js go build ./examples/svgview/
      - name: Test browser picture transport
        run: GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./svg -run TestBrowserSharedMemoryLifecycle -v

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240">
  <title>Shapes &amp; Opacity</title>
  <desc>Overlapping circles, rounded rectangles, polygons, and polylines with alpha blending.</desc>
  <rect x="0" y="0" width="360" height="240" fill="#0d1b2a"/>
  <circle cx="88" cy="84" r="50" fill="#e15759" opacity="0.9"/>
  <circle cx="142" cy="124" r="50" fill="#4e79a7" opacity="0.78"/>
  <circle cx="108" cy="158" r="50" fill="#59a14f" opacity="0.68"/>
  <rect x="215" y="42" width="110" height="64" rx="12" ry="12" fill="#f28e2b" stroke="#ffd166" stroke-width="2"/>
  <polygon points="270,124 328,212 212,212" fill="#edc948" stroke="#ffffff" stroke-width="1.5"/>
  <polyline points="24,222 92,192 158,214 226,174 336,204" fill="none" stroke="#76b7b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="28" font-family="sans-serif" font-size="16" fill="#e4e8ee" text-anchor="middle">Shapes &amp; Opacity</text>
  <text x="270" y="79" font-family="sans-serif" font-size="13" fill="#0d1b2a" text-anchor="middle">RoundRect</text>
</svg>

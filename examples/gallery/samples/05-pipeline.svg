  <text x="180" y="26" font-family="sans-serif" font-size="15" fill="#e4e8ee" text-anchor="middle">ntsvg Rendering Pipeline</text>
  <text x="66" y="72" font-family="monospace" font-size="12" fill="#8de3b6" text-anchor="middle">stage.Stage</text>
  <text x="66" y="90" font-family="sans-serif" font-size="10" fill="#a9b5c5" text-anchor="middle">Immediate API</text>
  <text x="66" y="156" font-family="monospace" font-size="12" fill="#4ea8de" text-anchor="middle">SVG Bytes</text>
  <text x="66" y="174" font-family="sans-serif" font-size="10" fill="#a9b5c5" text-anchor="middle">File / Reader</text>
  <text x="188" y="114" font-family="monospace" font-size="12" fill="#f28e2b" text-anchor="middle">ntsvg.Model</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240">
  <title>ntsvg Rendering Pipeline</title>
  <desc>Vector architecture diagram showing stage.Stage and SVG documents flowing through oksvg into ntpicture.</desc>
  <rect x="0" y="0" width="360" height="240" fill="#11151c"/>
  <rect x="20" y="48" width="92" height="54" rx="8" ry="8" fill="#1e293b" stroke="#8de3b6" stroke-width="2"/>
  <rect x="20" y="132" width="92" height="54" rx="8" ry="8" fill="#1e293b" stroke="#4ea8de" stroke-width="2"/>
  <rect x="142" y="90" width="92" height="54" rx="8" ry="8" fill="#1e293b" stroke="#f28e2b" stroke-width="2.5"/>
  <rect x="258" y="48" width="84" height="54" rx="8" ry="8" fill="#1e293b" stroke="#edc948" stroke-width="2"/>
  <rect x="258" y="132" width="84" height="54" rx="8" ry="8" fill="#1e293b" stroke="#e15759" stroke-width="2"/>
  <polyline points="112,75 130,75 130,108 142,108" fill="none" stroke="#8de3b6" stroke-width="2.5"/>
  <polyline points="112,159 130,159 130,126 142,126" fill="none" stroke="#4ea8de" stroke-width="2.5"/>
  <polyline points="234,108 246,108 246,75 258,75" fill="none" stroke="#edc948" stroke-width="2.5"/>
